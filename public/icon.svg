<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="hourglass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="sand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Inner border glow -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#60a5fa" stroke-width="4" opacity="0.4" />

  <!-- Hourglass Graphics -->
  <g transform="translate(106, 86)">
    <!-- Top & bottom bars -->
    <rect x="20" y="30" width="260" height="28" rx="14" fill="url(#hourglass)" />
    <rect x="20" y="282" width="260" height="28" rx="14" fill="url(#hourglass)" />

    <!-- Glass bulb outline -->
    <path d="M 50 58 C 50 140, 120 160, 150 170 C 180 160, 250 140, 250 58 Z" fill="rgba(255,255,255,0.2)" stroke="url(#hourglass)" stroke-width="12" stroke-linejoin="round" />
    <path d="M 50 282 C 50 200, 120 180, 150 170 C 180 180, 250 200, 250 282 Z" fill="rgba(255,255,255,0.2)" stroke="url(#hourglass)" stroke-width="12" stroke-linejoin="round" />

    <!-- Sand in top bulb -->
    <path d="M 80 110 C 100 135, 140 150, 150 166 C 160 150, 200 135, 220 110 Z" fill="url(#sand)" />

    <!-- Falling sand stream -->
    <line x1="150" y1="166" x2="150" y2="230" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />

    <!-- Sand mound in bottom bulb -->
    <path d="M 90 282 C 100 240, 200 240, 210 282 Z" fill="url(#sand)" />

    <!-- Sparkle Stars -->
    <circle cx="240" cy="50" r="14" fill="#fbbf24" />
    <circle cx="60" cy="270" r="10" fill="#fbbf24" />
  </g>
</svg>
